name: dfir-monitor

on:
  schedule:
    - cron: '40 * * * *' # ежедневно в 08:20 UTC = 11:20 по Москве
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        run: python thedfirreport/monitor_dfir.py

      - name: Commit and push results
        run: |
          git config user.name "reports-bot"
          git config user.email "reports-bot@users.noreply.github.com"
          git add thedfirreport/dfir_reports thedfirreport/seen_dfir.db
          git diff --quiet && git diff --cached --quiet || git commit -m "update dfir reports"
          git push
