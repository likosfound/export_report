name: telegram-binzone-web

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      TG_WEB_STORAGE: ${{ secrets.TG_WEB_STORAGE }}
      TG_SCAN_LIMIT: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run web capture
        run: python telegram_bizone/monitor_tg_bizone.py

      - name: Commit and push results
        run: |
          git config user.name "reports-bot"
          git config user.email "reports-bot@users.noreply.github.com"
          git add telegram_bizone/
          git diff --quiet && git diff --cached --quiet || git commit -m "update telegram reports"
          git push
